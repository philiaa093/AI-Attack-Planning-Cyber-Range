<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
 <title id="title">Vòng planning MDP/POMDP hữu hạn</title><desc id="desc">Trạng thái hoặc belief được cập nhật qua action hữu hạn, transition theo scenario và quan sát được phê duyệt. Hình thể hiện các trạng thái kết thúc dự kiến.</desc>
 <defs><style>text{font-family:'Times New Roman',serif;fill:#172033}.title{font-size:31px;font-weight:bold}.box{stroke-width:3;rx:18;ry:18}.label{font-size:25px;font-weight:bold}.small{font-size:18px}.flow{stroke:#365f91;stroke-width:5;fill:none;marker-end:url(#a)}.note{font-size:18px;fill:#6b7280;font-style:italic}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365f91"/></marker></defs>
 <rect width="1400" height="820" fill="#f8fafc"/><text x="700" y="55" text-anchor="middle" class="title">VÒNG MDP/POMDP HỮU HẠN — MÔ HÌNH ĐẶC TẢ DỰ KIẾN</text><text x="700" y="88" text-anchor="middle" class="small">Trọng số, xác suất và horizon cụ thể: TBD | Không phải trace runtime</text>
 <rect x="125" y="220" width="270" height="150" class="box" fill="#e9f2ff" stroke="#365f91"/><text x="260" y="270" text-anchor="middle" class="label">State / Belief</text><text x="260" y="302" text-anchor="middle" class="small">approved facts + normalized</text><text x="260" y="330" text-anchor="middle" class="small">observation / b(s)</text>
 <rect x="565" y="150" width="270" height="150" class="box" fill="#fff4d9" stroke="#ad7a12"/><text x="700" y="200" text-anchor="middle" class="label">Finite action</text><text x="700" y="232" text-anchor="middle" class="small">allowlisted catalog</text><text x="700" y="260" text-anchor="middle" class="small">a ∈ A</text>
 <rect x="1010" y="220" width="270" height="150" class="box" fill="#edf7ef" stroke="#3f7f54"/><text x="1145" y="270" text-anchor="middle" class="label">Transition</text><text x="1145" y="302" text-anchor="middle" class="small">scenario-defined T(s,a,s')</text><text x="1145" y="330" text-anchor="middle" class="small">progress − penalties</text>
 <rect x="565" y="490" width="270" height="150" class="box" fill="#efe9ff" stroke="#7155a5"/><text x="700" y="540" text-anchor="middle" class="label">Observation</text><text x="700" y="572" text-anchor="middle" class="small">approved O(o|s,a)</text><text x="700" y="600" text-anchor="middle" class="small">update state / belief</text>
 <path d="M395 270 H563" class="flow"/><path d="M835 270 H1008" class="flow"/><path d="M1145 370 V430 Q1145 490 837 490" class="flow"/><path d="M565 565 H400 Q260 565 260 372" class="flow"/>
 <text x="700" y="400" text-anchor="middle" class="small">R(s,a,s') = progress − safety − cost − uncertainty penalty</text>
 <rect x="145" y="700" width="190" height="65" class="box" fill="#ecf8f0" stroke="#3f7f54"/><text x="240" y="741" text-anchor="middle" class="label" style="font-size:20px">Success</text>
 <rect x="405" y="700" width="190" height="65" class="box" fill="#fff0f0" stroke="#a83a3a"/><text x="500" y="741" text-anchor="middle" class="label" style="font-size:20px">Refusal</text>
 <rect x="665" y="700" width="190" height="65" class="box" fill="#f1f5f9" stroke="#64748b"/><text x="760" y="741" text-anchor="middle" class="label" style="font-size:20px">Failure</text>
 <rect x="925" y="700" width="285" height="65" class="box" fill="#fff4d9" stroke="#ad7a12"/><text x="1068" y="741" text-anchor="middle" class="label" style="font-size:20px">Budget exhaustion</text>
 <text x="125" y="130" class="note">Unknown state: chỉ yêu cầu quan sát được phép hoặc dừng; uncertainty không mở rộng phạm vi.</text>
</svg>