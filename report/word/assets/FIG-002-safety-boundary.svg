<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
 <title id="title">Trust boundary và safety gate</title><desc id="desc">Vùng bên trong cyber range được phê duyệt; vùng ngoài bị loại trừ. Safety gate xử lý kiểm tra khuôn dạng, lab mode, target, action, điều kiện, ngân sách và approval.</desc>
 <defs><style>text{font-family:'Times New Roman',serif;fill:#172033}.title{font-size:31px;font-weight:bold}.box{stroke-width:3;rx:18;ry:18}.label{font-size:24px;font-weight:bold}.small{font-size:18px}.flow{stroke:#365f91;stroke-width:5;fill:none;marker-end:url(#a)}.deny{font-size:22px;font-weight:bold;fill:#a83a3a}.note{font-size:18px;fill:#6b7280;font-style:italic}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#365f91"/></marker></defs>
 <rect width="1400" height="850" fill="#f8fafc"/><text x="700" y="55" text-anchor="middle" class="title">TRUST BOUNDARY VÀ SAFETY GATE — SƠ ĐỒ THIẾT KẾ DỰ KIẾN</text>
 <rect x="45" y="110" width="720" height="640" class="box" fill="#ecf8f0" stroke="#3f7f54" stroke-dasharray="12 8"/><text x="75" y="150" class="label" fill="#25633d">BÊN TRONG: APPROVED ISOLATED WEB CYBER RANGE</text>
 <rect x="95" y="210" width="230" height="120" class="box" fill="#e9f2ff" stroke="#365f91"/><text x="210" y="255" text-anchor="middle" class="label">Đầu vào</text><text x="210" y="285" text-anchor="middle" class="small">scenario / model input</text>
 <rect x="430" y="175" width="280" height="440" class="box" fill="#fff4d9" stroke="#ad7a12"/><text x="570" y="218" text-anchor="middle" class="label">Safety gate</text>
 <text x="570" y="265" text-anchor="middle" class="small">1. Parse strict schema</text><text x="570" y="303" text-anchor="middle" class="small">2. Confirm lab mode</text><text x="570" y="341" text-anchor="middle" class="small">3. Resolve allowlisted target</text><text x="570" y="379" text-anchor="middle" class="small">4. Resolve catalog action</text><text x="570" y="417" text-anchor="middle" class="small">5. Check conditions / sequence</text><text x="570" y="455" text-anchor="middle" class="small">6. Check budget / rate / approval</text><text x="570" y="520" text-anchor="middle" class="deny">DEFAULT: DENY</text><text x="570" y="555" text-anchor="middle" class="small">ALLOW | DENY | REVIEW + audit</text>
 <rect x="95" y="480" width="230" height="120" class="box" fill="#efe9ff" stroke="#7155a5"/><text x="210" y="525" text-anchor="middle" class="label">Evidence</text><text x="210" y="555" text-anchor="middle" class="small">redacted + hashed</text>
 <path d="M325 270 H428" class="flow"/><path d="M430 520 H360 Q325 520 325 540" class="flow"/>
 <rect x="820" y="110" width="535" height="640" class="box" fill="#fff0f0" stroke="#a83a3a" stroke-dasharray="12 8"/><text x="850" y="150" class="label" fill="#a83a3a">BÊN NGOÀI: KHÔNG THUỘC PHẠM VI</text>
 <text x="885" y="220" class="label">• Public targets / production systems</text><text x="885" y="278" class="label">• Internet scanning</text><text x="885" y="336" class="label">• Credentials / unrestricted shell</text><text x="885" y="394" class="label">• Dynamic code / arbitrary destination</text><text x="885" y="452" class="label">• Destructive operation</text><text x="885" y="510" class="label">• Unapproved data / evidence overwrite</text>
 <text x="70" y="805" class="note">Mọi trust crossing phải được xác thực và chuẩn hóa. Dữ liệu sai khuôn dạng hoặc thiếu trường bắt buộc bị từ chối, không được suy đoán.</text>
</svg>